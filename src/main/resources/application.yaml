spring:
  application:
    name: docinhos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docinhos}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    cors:
      allowed-origins: ${WEB_API:http://localhost:5173}

  security:
    jwt:
      secret: ${JWT_SECRET:u4uLv6jiw9nqZbx4a8pp57VfO/+Winj9IV8EMN8LBBQ=}
      expiration: 3600000

management:
  endpoints:
    web:
      cors:
        allowed-origins: ${WEB_API:http://localhost:5173}
        allowed-methods: OPTIONS, GET, POST
