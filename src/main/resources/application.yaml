spring:
  application:
    name: docinhos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docinhos}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    cors:
      allowed-origins: ${WEB_API:http://localhost:3000}